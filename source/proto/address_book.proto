syntax = "proto3";

option optimize_for = LITE_RUNTIME;

import "common.proto";
import "desktop.proto";

package proto.address_book;

enum EncryptionType
{
    ENCRYPTION_TYPE_UNKNOWN            = 0;
    ENCRYPTION_TYPE_NONE               = 1;
    ENCRYPTION_TYPE_XCHACHA20_POLY1305 = 2;
    ENCRYPTION_TYPE_CHACHA20_POLY1305  = 3;
}

message SessionConfig
{
    DesktopConfig desktop_manage = 1;
    DesktopConfig desktop_view   = 2;
}

message InheritConfig
{
    bool credentials    = 1;
    bool desktop_manage = 2;
    bool desktop_view   = 3;
}

message Computer
{
    int64 create_time = 1;
    int64 modify_time = 2;
    // Field 3 not used (deprecated).

    string name       = 4;
    string comment    = 5;
    string address    = 6;
    uint32 port       = 7;
    string username   = 8;
    string password   = 9;

    // Fields 10-11 are reserved.

    InheritConfig inherit = 12;

    // Fields 13-15 are reserved.

    // Session configurations.
    SessionType session_type = 16;
    SessionConfig session_config  = 17;

    // Identity of the record, assigned when it is created and never changed afterwards. A book
    // written by an older version carries none, and one is given to every record without it when
    // the book is opened.
    //
    // Renaming a computer, moving it to another group or changing its password leaves the guid
    // alone: it answers "the same record", which is what synchronization needs and what a name or
    // a position in the tree cannot answer.
    //
    // Note on the field number: 10-11 and 13-15 are reserved above, and taking a reserved number
    // would collide with whatever upstream puts there later.
    string guid = 18;
}

message ComputerGroupConfig
{
    InheritConfig inherit = 1;

    string username = 2;
    string password = 3;

    // Fields 4-20 are reserved.

    SessionConfig session_config  = 21;
}

message ComputerGroup
{
    int64 create_time = 1;
    int64 modify_time = 2;

    // List of child computers.
    repeated Computer computer = 3;

    // List of child computer groups.
    repeated ComputerGroup computer_group = 4;

    string name    = 5;
    string comment = 6;
    bool expanded  = 7;

    // Fields 8-20 are reserved.

    ComputerGroupConfig config = 21;

    // Identity of the record. See Computer.guid; the same rules apply, and moving a group to
    // another parent or renaming it keeps the guid.
    //
    // 8-20 are reserved above and 21 is taken, so the numbering continues from 22.
    string guid = 22;
}

message Router
{
    string address  = 1;
    uint32 port     = 2;
    string username = 3;
    string password = 4;
}

message Data
{
    // Field 1 - Deprecated.
    ComputerGroup root_group = 2;
    // Field 3 - Deprecated.

    // Enable or disable router.
    bool enable_router = 4;

    // Connection parameters for the router.
    Router router = 5;

    // Unique GUID for address book.
    string guid = 6;

    // Display name when connected.
    string display_name = 7;

    // Synchronization with a router. Personal to this copy of the book: it says what this console
    // has and has not sent, and means nothing on another machine.
    SyncState sync = 8;
}

// What the console remembers about synchronizing this book with a router.
//
// It lives in the book file so that it survives a restart: a console that forgot which revision it
// had would ask for the whole book again, and one that forgot which edits it had not sent yet
// would lose them.
message SyncEntryState
{
    string guid = 1;

    // The revision the base below was taken at.
    int64 revision = 2;

    // The record as the router had it when it was last seen. Merging a conflict takes three
    // versions - this one, what is here now, and what the router has - and without the first it is
    // impossible to tell which side changed a field, so both would have to be shown to a person
    // even when only one of them touched anything.
    bytes base_payload = 3;

    // The group the record was in when the base above was taken. Where a record sits is not part
    // of the record itself, so without this a move would be invisible to the comparison that finds
    // what has changed here.
    string base_parent_guid = 6;

    // The record was changed here and the change has not reached the router yet.
    bool dirty = 4;

    // The record was deleted here and the deletion has not reached the router yet. Kept apart from
    // the record being gone, because it has to be sent before it can be forgotten.
    bool deleted = 5;
}

message SyncState
{
    // Empty means the book is not synchronized and stays on this machine alone.
    string book_guid = 1;

    // The epoch of the book when it was last read. A different one means the database of the
    // router was restored from a backup and what is remembered about the revision refers to
    // nothing.
    string epoch = 2;

    int64 last_pulled_revision = 3;

    repeated SyncEntryState entry = 4;
}

message File
{
    // Encryption type.
    EncryptionType encryption_type = 1;

    // Field 2 not used (deprecated).

    // If encryption is enabled, contains salt (random data), which are added at each iteration
    // of the hashing to create the key.
    // When the encryption is disabled, the field is not used.
    bytes hashing_salt = 3;

    // Fields 4-8 are reserved.

    // If the encryption is enabled, it contains serialized and encrypted |Data|.
    // If the encryption is disabled, it contains a serialized |Data|.
    bytes data = 9;
}
